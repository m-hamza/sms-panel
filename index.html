<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="description" content="پنل مدیریت و ارسال پیامک بر پایه وب‌سرویس IPPanel Edge API" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IPPanel" />
    <title>پنل پیامک IPPanel</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #070b14;
        color: #e5e7eb;
      }
      html.light, html.light body {
        background-color: #f8fafc !important;
        color: #0f172a;
      }
    </style>
    <script>
      (function () {
        var theme = 'dark';
        try {
          theme = localStorage.getItem('theme') || 'dark';
        } catch(e) {}
        document.documentElement.classList.add(theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // ثبت Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js')
            .then(function(registration) {
              console.log('[PWA] Service Worker ثبت شد:', registration.scope);
              
              // ثبت Periodic Sync
              if ('periodicSync' in registration) {
                navigator.permissions.query({ name: 'periodic-background-sync' }).then(function(status) {
                  if (status.state === 'granted') {
                    registration.periodicSync.register('refresh-data', {
                      minInterval: 24 * 60 * 60 * 1000 // هر 24 ساعت
                    }).then(function() {
                      console.log('[PWA] Periodic Sync ثبت شد');
                    }).catch(function(error) {
                      console.log('[PWA] خطا در ثبت Periodic Sync:', error);
                    });
                  }
                });
              }
            })
            .catch(function(error) {
              console.log('[PWA] خطا در ثبت Service Worker:', error);
            });
        });
      }
      
      // درخواست مجوز نوتیفیکیشن
      if ('Notification' in window) {
        Notification.requestPermission().then(function(permission) {
          if (permission === 'granted') {
            console.log('[PWA] مجوز نوتیفیکیشن داده شد');
          }
        });
      }
    </script>
  </body>
</html>
