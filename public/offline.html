<!DOCTYPE html>

    .button { display: inline-block; padding: 12px 32px; background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); color: white; text-decoration: none; border-radius: 12px; font-size: 14px; font-weight: 500; }
